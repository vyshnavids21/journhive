<div class="auth-page">
  <div class="auth-card narrow">
    <section class="form-panel">
      <div class="icon-badge"><mat-icon>lock_reset</mat-icon></div>

      <h1 class="auth-title">Forgot your password?</h1>
      <p class="auth-subtitle">Enter the email you signed up with and we'll send you a link to reset it.</p>

      <form class="auth-form" #form="ngForm" (ngSubmit)="onSubmit()" novalidate>
        <mat-form-field appearance="outline">
          <mat-icon matPrefix>mail_outline</mat-icon>
          <mat-label>Email</mat-label>
          <input matInput type="email" name="email" [(ngModel)]="email" required email
            (blur)="validateEmail()" (input)="resetEmail()" autocomplete="email">
        </mat-form-field>

        <p *ngIf="validEmail === false && email" class="field-error" role="alert">
          <mat-icon>error_outline</mat-icon> Please enter a valid email
        </p>

        <button class="btn btn-primary btn-lg btn-block submit" type="submit" [disabled]="form.invalid || loading">
          <span *ngIf="loading" class="spinner" aria-hidden="true"></span>
          {{ loading ? 'Sending link…' : 'Send reset link' }}
        </button>
      </form>

      <p class="auth-footer">
        Remembered it? <a routerLink="/login">Back to log in</a>
      </p>
    </section>
  </div>
</div>
